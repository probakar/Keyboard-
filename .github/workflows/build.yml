name: Build APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # v3 requested Google's retired `tools` package by default. v4 removes it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Use the Gradle distribution installed above. This repository intentionally does not
      # commit gradle-wrapper.jar, so the CI build should not need to bootstrap one.
      - name: Build debug APK
        id: build_apk
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Surface Gradle failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("build.log")
          text = log.read_text(errors="replace") if log.exists() else "No build.log was produced."
          source_lines = text.splitlines()
          selected = set()
          for index, line in enumerate(source_lines):
              if re.search(
                  r"^e: |^w: |error|failed|AAPT|not found|resource linking|Could not resolve|Exception|Caused by:|Execution failed|Unresolved reference|Type mismatch|Overload resolution ambiguity",
                  line,
                  re.IGNORECASE,
              ):
                  selected.update(range(max(0, index - 1), min(len(source_lines), index + 2)))
          lines = [source_lines[index].strip() for index in sorted(selected)]
          if not lines:
              lines = source_lines[-25:]
          for line in lines[-40:]:
              message = line[:1000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle build diagnostic::{message}")
          PY

      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee test.log

      - name: Surface unit test failure diagnostics
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("test.log")
          text = log.read_text(errors="replace") if log.exists() else "No test.log was produced."
          source_lines = text.splitlines()
          selected = set()
          for index, line in enumerate(source_lines):
              if re.search(
                  r"error|failed|Exception|AssertionError|expected:|but was|FAILURE|tests completed",
                  line,
                  re.IGNORECASE,
              ):
                  selected.update(range(max(0, index - 1), min(len(source_lines), index + 2)))
          lines = [source_lines[index].strip() for index in sorted(selected)]
          if not lines:
              lines = source_lines[-30:]
          for line in lines[-40:]:
              message = line[:1000].replace("%", "%25")
              print(f"::error title=Unit test diagnostic::{message}")
          PY

      - name: Android Lint
        run: gradle lintDebug --stacktrace
        continue-on-error: true

      - name: Upload APK
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: CustomBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: |
            build.log
            test.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
