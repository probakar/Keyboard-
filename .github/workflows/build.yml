name: Build APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # v3 requested Google's retired `tools` package by default. v4 removes it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Use the Gradle distribution installed above. This repository intentionally does not
      # commit gradle-wrapper.jar, so the CI build should not need to bootstrap one.
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Surface Gradle failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("build.log")
          text = log.read_text(errors="replace") if log.exists() else "No build.log was produced."
          lines = [line.strip() for line in text.splitlines() if re.search(
              r"^e: |^FAILURE:|^What went wrong:|^Execution failed for task|^A problem occurred|^Could not ",
              line,
          )]
          if not lines:
              lines = text.splitlines()[-25:]
          for line in lines[-30:]:
              message = line[:1000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle build diagnostic::{message}")
          PY

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Android Lint
        run: gradle lintDebug --stacktrace
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: CustomBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
